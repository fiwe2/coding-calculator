<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/gh/Destroyed12121/Staticsj@main/JS/scramjet.all.js" defer></script>

    <script type="module">
        import * as BareMux from "https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-mux/dist/index.mjs";
        window.BareMux = BareMux;
    </script>

    <script src="./script.js" defer></script>
</head>

<body>

    <div id="app"></div>

    <!-- New Tab Template -->
    <template id="new-tab-template">

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: Inter, system-ui, sans-serif;
                background: #0a0a0a;
                color: #e4e4e7;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 40px 20px;
            }

            .clock {
                font-size: 4rem;
                font-weight: 600;
                letter-spacing: -2px;
                margin-bottom: 8px;
                color: #fff;
            }

            .date {
                font-size: 14px;
                color: #71717a;
                margin-bottom: 32px;
            }

            .search-box {
                display: flex;
                align-items: center;
                gap: 8px;
                background: #0f0f0f;
                border: 1px solid #1f1f1f;
                border-radius: 12px;
                padding: 12px 16px;
                width: 100%;
                max-width: 500px;
                margin-bottom: 40px;
            }

            .search-box i {
                color: #71717a;
                font-size: 14px;
            }

            .search-box input {
                flex: 1;
                min-width: 0;
                background: transparent;
                border: 0;
                outline: 0;
                color: #e4e4e7;
                font: 14px inherit;
            }

            .search-box input::placeholder {
                color: #52525b;
            }

            .search-box select {
                background: #1a1a1a;
                border: 0;
                border-radius: 6px;
                color: #71717a;
                padding: 6px 10px;
                font-size: 12px;
                cursor: pointer;
            }

            .shortcuts {
                display: grid;
                grid-template-columns: repeat(5, 1fr);
                gap: 16px;
                width: 100%;
                max-width: 500px;
            }

            .shortcut {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 8px;
                text-decoration: none;
                cursor: pointer;
            }

            .shortcut-icon {
                width: 52px;
                height: 52px;
                background: #0f0f0f;
                border: 1px solid #1f1f1f;
                border-radius: 12px;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: all .15s;
            }

            .shortcut:hover .shortcut-icon {
                background: #1a1a1a;
                transform: translateY(-2px);
            }

            .shortcut-icon img {
                width: 22px;
                height: 22px;
                filter: brightness(0) invert(.7);
            }

            .shortcut-icon i {
                font-size: 20px;
                color: #71717a;
            }

            .shortcut-label {
                font-size: 11px;
                color: #71717a;
                text-align: center;
                max-width: 60px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .shortcut:hover .shortcut-label {
                color: #e4e4e7;
            }

            .quote {
                position: fixed;
                bottom: 24px;
                font-size: 13px;
                color: #52525b;
                max-width: 400px;
                text-align: center;
            }

            @media (max-width: 420px) {
                .shortcuts {
                    grid-template-columns: repeat(5, minmax(0, 1fr));
                    gap: 10px;
                }

                .shortcut-icon {
                    width: 46px;
                    height: 46px;
                }

                .clock {
                    font-size: 3.2rem;
                }
            }
        </style>

        <div class="clock" id="clock">00:00</div>
        <div class="date" id="date"></div>

        <form class="search-box" id="searchForm">
            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                id="searchInput"
                placeholder="Search the web..."
                autocomplete="off"
            >

            <select id="engine">
                <option value="https://search.brave.com/search?q=">Brave</option>
                <option value="https://duckduckgo.com/?q=">DuckDuckGo</option>
                <option value="https://www.google.com/search?q=">Google</option>
            </select>
        </form>

        <!-- Shortcuts -->
        <div class="shortcuts" id="shortcuts">

            <a class="shortcut" data-url="https://youtube.com">
                <div class="shortcut-icon">
                    <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/youtube.svg" alt="">
                </div>
                <span class="shortcut-label">YouTube</span>
            </a>

            <a class="shortcut" data-url="https://github.com">
                <div class="shortcut-icon">
                    <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/github.svg" alt="">
                </div>
                <span class="shortcut-label">GitHub</span>
            </a>

            <a class="shortcut" data-url="https://discord.com">
                <div class="shortcut-icon">
                    <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/discord.svg" alt="">
                </div>
                <span class="shortcut-label">Discord</span>
            </a>

            <a class="shortcut" data-url="https://twitter.com">
                <div class="shortcut-icon">
                    <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/x.svg" alt="">
                </div>
                <span class="shortcut-label">Twitter</span>
            </a>

            <a class="shortcut" data-url="https://reddit.com">
                <div class="shortcut-icon">
                    <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/reddit.svg" alt="">
                </div>
                <span class="shortcut-label">Reddit</span>
            </a>

            <a class="shortcut" data-url="https://spotify.com">
                <div class="shortcut-icon">
                    <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/spotify.svg" alt="">
                </div>
                <span class="shortcut-label">Spotify</span>
            </a>

            <a class="shortcut" data-url="https://netflix.com">
                <div class="shortcut-icon">
                    <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/netflix.svg" alt="">
                </div>
                <span class="shortcut-label">Netflix</span>
            </a>

            <a class="shortcut" data-url="https://twitch.tv">
                <div class="shortcut-icon">
                    <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/twitch.svg" alt="">
                </div>
                <span class="shortcut-label">Twitch</span>
            </a>

            <a class="shortcut" data-url="https://mail.google.com">
                <div class="shortcut-icon">
                    <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/gmail.svg" alt="">
                </div>
                <span class="shortcut-label">Gmail</span>
            </a>

            <div class="shortcut" id="addShortcut">
                <div class="shortcut-icon">
                    <i class="fa-solid fa-plus"></i>
                </div>
                <span class="shortcut-label">Add</span>
            </div>

        </div>

        <div class="quote" id="quote"></div>

        <!-- New Tab JavaScript -->
        <script>
            const $ = selector => document.querySelector(selector);

            const navigate = url => {
                parent.postMessage({ type: 'navigate', url }, '*');
            };

            // Clock and date
            function updateClock() {
                const now = new Date();

                $('#clock').textContent = now.toLocaleTimeString('en-US', {
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false
                });

                $('#date').textContent = now.toLocaleDateString('en-US', {
                    weekday: 'long',
                    month: 'long',
                    day: 'numeric'
                });
            }

            updateClock();
            setInterval(updateClock, 1000);

            // Search
            $('#searchForm').addEventListener('submit', event => {
                event.preventDefault();

                const query = $('#searchInput').value.trim();

                if (query) {
                    navigate($('#engine').value + encodeURIComponent(query));
                }
            });

            // Shortcuts
            $('#shortcuts').addEventListener('click', event => {
                const shortcut = event.target.closest('.shortcut[data-url]');

                if (shortcut) {
                    event.preventDefault();
                    navigate(shortcut.dataset.url);
                    return;
                }

                if (event.target.closest('#addShortcut')) {
                    const name = prompt('Shortcut name:');
                    if (!name) return;

                    let url = prompt('URL:');
                    if (!url) return;

                    if (!/^https?:\/\//i.test(url)) {
                        url = 'https://' + url;
                    }

                    const saved = JSON.parse(
                        localStorage.getItem('shortcuts') || '[]'
                    );

                    saved.push({ name, url });

                    localStorage.setItem('shortcuts', JSON.stringify(saved));

                    renderCustom();
                }
            });

            // Custom shortcuts
            function renderCustom() {
                document.querySelectorAll('.custom-shortcut').forEach(item => {
                    item.remove();
                });

                const addButton = $('#addShortcut');

                JSON.parse(localStorage.getItem('shortcuts') || '[]').forEach(item => {
                    const shortcut = document.createElement('div');

                    shortcut.className = 'shortcut custom-shortcut';
                    shortcut.dataset.url = item.url;

                    const icon = document.createElement('div');
                    icon.className = 'shortcut-icon';
                    icon.innerHTML = '<i class="fa-solid fa-link"></i>';

                    const label = document.createElement('span');
                    label.className = 'shortcut-label';
                    label.textContent = item.name;

                    shortcut.append(icon, label);
                    addButton.before(shortcut);
                });
            }

            // Random quote
            const quotes = [
                'so tuff',
                'it is what it is',
                'do ur work',
                'this is what happens when u dont touch grass',
                'FULL BOX',
                'FULL PIECE',
                '200!',
                'press esc + refresh + power button for hacks',
                'press ctrl+x to hide your screen',
                'change the tab title and favicon in settings',
                'TEACHERR!',
                'lebron lebron lebronn james',
                'lebron is OUR goat'
            ];

            $('#quote').textContent =
                quotes[Math.floor(Math.random() * quotes.length)];

            renderCustom();
        </script>

    </template>

    <!-- Proxy Settings -->
    <div class="wisp-settings-modal hidden" id="wisp-settings-modal">

        <div class="settings-card">

            <div class="settings-header">
                <h2>
                    <i class="fa-solid fa-server"></i>
                    Proxy Settings
                </h2>

                <button class="close-btn" id="close-wisp-modal">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="settings-content">

                <div class="section-title">
                    <i class="fa-solid fa-cloud"></i>
                    Select Server
                </div>

                <div class="server-list" id="server-list"></div>

                <div class="section-title">
                    <i class="fa-solid fa-plus-circle"></i>
                    Custom Server
                </div>

                <div class="custom-input-group">
                    <input
                        type="text"
                        id="custom-wisp-input"
                        placeholder="wss://your-wisp-server.com/wisp/"
                    >

                    <button id="save-custom-wisp">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>

            </div>

            <div class="settings-footer">
                Lower ping = faster browsing
            </div>

        </div>
    </div>

</body>
</html>
